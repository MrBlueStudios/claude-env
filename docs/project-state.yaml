      Sit with the one switch that moves superpowers onto an inline pinned marketplace
    owner: both
    why_yours: a live session, because the one plugin you actually use can stop loading
    guide: claude-env-superpowers-pin
    status: open
    added: 2026-11-24
    note: >-
      q-superpowers-pin answered 2026-11-24, option two. Claude writes the inline settings
      marketplace keeping the id superpowers@superpowers-marketplace and pinning 7.0.2's sha; you
      are present for the switch and the next session start, because changing how the plugin
      resolves makes it re-fetch, and a bad fetch means no superpowers at all. Needs no Claude
      Code 2.1.324 — that floor is on marketplace pins, not plugin ones.
      .
      How to start it, asked for and answered 2026-11-24: in ~/Projects/claude-env, NOT
      /etc/nixos — the edit is to this repo's modules/home/settings.nix (the existing
      superpowers-marketplace block is at lines 32-38 and its comment already explains why the
      catalog pin does not pin the plugin), and /etc/nixos only consumes it as a flake input.
      Command: `claude --model opus --effort high`. Opus because the ten-line diff is trivial
      but the resolution-order reasoning is not; `high` rather than xhigh or max, which buy
      nothing on a diff this size; fast mode off, since it trades deliberation for output speed
      on the one change that can silently unload every plugin. He needs to send nothing up
      front — Claude can read ~/.claude.json, ~/.claude/settings.json and the repo itself, and
      fetch 7.0.2's sha with gh. Afterwards he must paste `claude plugin list` and
      `claude-plugins-check` from the NEW session, which the working session cannot see. The
      ready-to-paste prompt is on the todo board's card 6; step 2 of that card is the one people
      forget — `nix flake update claude-env` in /etc/nixos, or the switch succeeds while
      changing nothing.

