project: claude-env
goal: >-
  A shareable NixOS flake that gives Léon and his friends the same Claude Code environment —
  every MCP server, skill, agent and guardrail available in every project folder — with a
  Blitsol tier for the people who also work on the company.
non_goals:
  - Sharing Léon's personal nix-config (hardware, backups, host secrets) with friends
  - Handing friends Blitsol credentials by copy-paste instead of inviting them into the real accounts
  - Adding an MCP server where a CLI already does the job better (the CLI-first rule in CLAUDE.md)
  - Rebuilding the Claude Code config as dotfiles; it is already home-manager and stays that way
  - >-
    Building the shared crew memory system or its dashboard — its own project (crew-memory),
    designed 2026-11-13 and built to v0 on 2026-11-19 at ~/Projects/crew-memory; claude-env
    only ships the tools it needs and the CLM host it depends on. What claude-env still owes it
    is the packaging: the crew-memory CLI on PATH and its capture skill installed for all four,
    once crew-memory is its own repo (the claude-web-stack pattern)
  - >-
    Building the booking starter or the client legal-document generator — both are real gaps the
    coverage audit found, and both belong in their own repos
updated: "2026-11-21T02:10"
suite:
  command: just test
  result: green
  as_of: 2026-11-21
  note: >-
    Evaluates the home-manager module (base and blitsol) and the NixOS guard on nixpkgs 25.05 and
    26.05 (tests/eval-*), runs shellcheck over the eight packaged scripts, then the 65 guard
    cases and 144 helper-script tests, and finally *builds* three things on each release: the
    base home-manager generation; the same module with every option on, which is the only thing
    that builds what sits behind an off-by-default flag (claude-mode, the six opt-in MCP
    servers); and the system guard's claude-guard script, reached by building the
    managed-settings file, whose `command` interpolates the guard's store path, so the string
    context forces it. The builds are new on 2026-11-20 and their absence is what
    shipped a broken switch: writeShellApplication runs shellcheck in its check phase, which no
    `nix eval` reaches, so two scripts with style findings evaluated green and failed to build.
    The guard and all-on builds were added on 2026-11-21 after noticing the first fix
    covered only a base-tier home generation; mutation-checked by planting the same em-dash finding in guard.sh, which now fails
    the suite with the same exit code 2 it would have failed a switch with. `just test-fast` is
    the same suite without the builds, for the inner loop. Nothing switches.
    `just plugins-check` is deliberately not part of it: it reports the state of the machine it
    runs on, which is not a property of the repo.
