  - id: mt-declare-personal-servers
    text: >-
      Add obsidian and vies-vat to claude-env.mcp.personal in /etc/nixos before the next switch,
      or accept losing them
    status: open
    why: >-
      mcp.nix now owns the user-scope mcpServers block, so a server that is not declared is
      removed at the next switch. Two of the ten currently registered are undeclared on purpose:
      obsidian points at ~/Obsidian/ZEN-Vault, which is personal, and vies-vat runs from a path
      in ~/projects (q-vies-vat argues for replacing it with a CLI). Both are recoverable — the
      switch writes them to ~/.claude/removed-mcp-servers.json — so this is a convenience, not a
      risk. The other six removals (memory, github, filesystem, sentry, cloudflare at base tier,
      playwright's old npx form) are all deliberate.
