    answer: null
  - id: q-superpowers-pin
    question: >-
      superpowers is the one plugin the flake cannot pin, because its catalog entry fetches a
      branch. Replace the catalog with our own pinned one?
    options:
      - Leave it floating; re-vet when a new version shows up in `just plugins-check`
      - Declare an inline `settings` marketplace under the same name, pinning the plugin's own sha
      - Fork obra/superpowers-marketplace and pin the fork
    recommendation: >-
      The second, but not unsupervised. An inline `settings` source keeps the plugin id
      (superpowers@superpowers-marketplace), so no skill prefix changes, and its catalog entry
      can carry the plugin's own `sha` — which is the only way to pin the bytes. The cost is
      that it changes how the plugin resolves, so the next session re-fetches it, and if that
      goes wrong the one plugin the transcripts show being used stops loading. Worth one
      supervised switch rather than a surprise. It is also the only option that needs no Claude
      Code 2.1.324, since the version floor is on marketplace pins, not plugin ones.
      .
      Option three works too and costs a repo to maintain forever. Option one is what is in
      place now, and the drift it allows is real but small: 7.0.0 installed against 7.0.2
      upstream, both from the same named author.
    blocks: []
    blocks_note: >-
      Not blocking: the marketplace is pinned either way, and only the plugin's own bytes float.
    answer: null
  - id: q-vies-vat
    question: >-
      The vies-vat MCP server is a clone of someone else's template repo running from a path in
      Léon's home. Package it, keep it personal, or replace it with a CLI?
    options:
      - Replace it with a small vat-check CLI in tools.nix, and drop the server
      - Keep it personal — claude-env.mcp.personal on Léon's machine only
      - Package the upstream repo with buildNpmPackage and declare it at base tier
    recommendation: >-
      The first. The audit recorded this one as "Léon's own build, must be built by Nix", and
      it is neither: it is Jazib-but/check-vat-vies-mcp-Jazib, MIT, with an api-server.js, a
      Dockerfile, a Coolify deployment guide and placeholder hosts (your-n8n-instance.com,
      railway.app) still in it. `just vet` clears it — no hooks, no keys, and the only real
      outbound host is ec.europa.eu, which is the VIES API itself — so this is not a safety
      objection. It is a value one: the whole server is a SOAP call to one government endpoint,
      and a server costs its tool descriptions in every session on four laptops, where a CLI
      costs nothing until it is run. CLAUDE.md already says to prefer a CLI where one does the
      job. Forty lines of Python against the VIES REST endpoint, in tools.nix next to
      compliance-scan, is both cheaper and reproducible, which packaging the repo would not be
      (its dist/ is committed and its lockfile would have to be vendored).
      .
      Until this is decided the server is undeclared, which means Léon's next switch removes it
      from user scope and saves it to ~/.claude/removed-mcp-servers.json. Option two is one line
      in /etc/nixos if he wants it back untouched.
    blocks: []
    blocks_note: >-
      Not blocking: invoicing does not wait on this, and the removal is recoverable from the
      file the switch writes.
    answer: null
