project: claude-env
goal: >-
  A shareable NixOS flake that gives Léon and his friends the same Claude Code environment —
  every MCP server, skill, agent and guardrail available in every project folder — with a
  Blitsol tier for the people who also work on the company.
non_goals:
  - Sharing Léon's personal nix-config (hardware, backups, host secrets) with friends
  - Handing friends Blitsol credentials by copy-paste instead of inviting them into the real accounts
  - Adding an MCP server where a CLI already does the job better (the CLI-first rule in CLAUDE.md)
  - Rebuilding the Claude Code config as dotfiles; it is already home-manager and stays that way
  - >-
    Building the shared crew memory system or its dashboard — its own project (crew-memory),
    designed 2026-11-13 and built to v0 on 2026-11-19 at ~/Projects/crew-memory; claude-env
    only ships the tools it needs and the CLM host it depends on. What claude-env still owes it
    is the packaging: the crew-memory CLI on PATH and its capture skill installed for all four,
    once crew-memory is its own repo (the claude-web-stack pattern)
  - >-
    Building the booking starter or the client legal-document generator — both are real gaps the
    coverage audit found, and both belong in their own repos
updated: "2026-11-20T11:20"
suite:
  command: just test
  result: green
  as_of: 2026-11-20
  note: >-
    Evaluates the home-manager module (base and blitsol) and the NixOS guard on nixpkgs 25.05 and
    26.05 (tests/eval-*), then runs the 58 guard cases and 134 helper-script tests. Nothing is
    built or switched. `just plugins-check` is deliberately not part of it: it reports the state
    of the machine it runs on, which is not a property of the repo.
artifacts:
  status: https://claude.ai/code/artifact/71c33b0d-0713-44c6-a94c-bf3312635352
  todo: https://claude.ai/code/artifact/e3563a45-ca0e-44d9-b157-56b3b202b2f6
features:
  - id: mcp-consolidate
    name: Consolidate the 36 scattered MCP servers
    status: done
    note: >-
      Servers were split across three local scopes plus user and project scope; 24 of them were
      reachable only by cd-ing into ~/projects/fastsdcpu or ~, which is why the web-design
      toolkit was invisible everywhere else.
    remaining: >-
      Done 2026-11-20, as part of mcp-declarative rather than as a separate one-off: the prune
      is a clause in the same activation script, so it cannot be half-run or forgotten. Any
      local-scope copy of a declared or dropped server is removed from every projects[<dir>]
      entry on every switch; a local server nobody listed is kept and reported, because it may
      be deliberate. The drop list is 23 names with the audit's reason beside each, now
      including overheid-apis, which turned out not to exist on npm at all.
    paths:
      - /home/leon-new/Projects/claude-env/modules/home/mcp.nix
      - /home/leon-new/Projects/claude-env/modules/home/scripts/claude-mcp.sh
    refs:
      - "mcp.nix lines 11-15 — the CLI-first policy comment, now confirmed as the truth"
  - id: mcp-declarative
    name: Make mcp.nix the single source of truth
    status: done
    note: >-
      mcp.nix used to ship a setup-claude-mcp.sh that had to be run by hand, so user-scope
      servers drifted the moment anyone typed `claude mcp add`. That drift is what produced the
      39 registrations the audit found.
    remaining: >-
      Done 2026-11-20. The script is gone; scripts/claude-mcp.sh writes the declared block on
      activation and prunes the local scopes, and ct-mcp-declarative has the detail. The
      settings half landed the same day (ct-plugin-channel): settings.nix now owns
      enabledPlugins and extraKnownMarketplaces outright for the same reason.
    paths:
      - /home/leon-new/Projects/claude-env/modules/home/mcp.nix
      - /home/leon-new/Projects/claude-env/modules/home/scripts/claude-mcp.sh
      - /home/leon-new/Projects/claude-env/modules/home/settings.nix
  - id: extract-flake
    name: Extract modules/home/claude into its own flake
    status: done
    note: >-
      Done 2026-11-16. ~/Projects/claude-env exports homeManagerModules.default and
      nixosModules.default (the guard); nix-config consumes it as the claude-env input (a path:
      URL until the repo is pushed) and the mr-blue system builds from it, with the managed
      settings byte-identical and CLAUDE.md differing only by the personal lines moving under
      "This machine". Portability fixes on the way: no `inputs` argument (the playbook comes
      through claude-env.webDesignPlaybook), prettier and nixfmt resolved per release, claude-mode
      behind claude-env.modes.enable, the dropped user-scope servers added to mcp.nix's prune list.
    remaining: >-
      The switch itself (`nh os switch /etc/nixos`) and making claude-env its own repo — both
      Léon's (mt-switch-to-flake, mt-repo-init). The old modules/home/claude and
      claude-code-policy.nix in nix-config are now unused and can be deleted after the switch.
    paths:
      - /home/leon-new/Projects/claude-env/flake.nix
      - /home/leon-new/Projects/claude-env/modules/home/default.nix
      - /home/leon-new/Projects/claude-env/modules/home/options.nix
      - /home/leon-new/Projects/claude-env/modules/system/guard.nix
      - /home/leon-new/Projects/claude-env/tests/eval-25.05/flake.nix
  - id: tiers
    name: Base and Blitsol tiers
    status: done
    note: >-
      One option, claude-env.tier = "base" | "blitsol", decides whether a machine gets the
      company servers on top of the shared toolkit.
    remaining: >-
      Done 2026-11-20 and asserted by `just test` on both releases: base resolves to atlassian,
      context7 and playwright exactly; blitsol adds cloudflare. Six opt-in modules are wired and
      all default off. No separate tiers.nix: the tier is read where it has an effect, which is
      mcp.nix and the CLAUDE.md header, and a file that only re-exports a boolean would be a
      layer with nothing in it. ct-tiers records what the tier can and cannot contain now that
      Moneybird is gone, and the HyperFrames suite stays in tools.nix, where it is packaging
      rather than a tier. The secrets half waits on mt-collect-keys.
    paths:
      - /home/leon-new/Projects/claude-env/modules/home/options.nix
      - /home/leon-new/Projects/claude-env/modules/home/mcp.nix
  - id: secrets-delivery
    name: Shared Blitsol secrets via agenix
    status: planned
    note: >-
      agenix is already an input of nix-config and already holds claude-api-key and borg
      passphrases, so the mechanism exists; what is missing is multi-recipient re-keying.
    remaining: >-
      A private blitsol-secrets repo whose secrets.nix lists each client-work friend's SSH public
      key as a recipient, plus an enrolment runbook for adding and removing a person.
    paths:
      - /etc/nixos/secrets/secrets.nix
    waiting_on: mt-collect-keys — the recipient list is the list of keys
  - id: connector-invites
    name: Real account invites for Blitsol-tier friends
    status: blocked
    note: >-
      The claude.ai connectors (HubSpot, Gmail, Calendar, Drive, Clay, QuickBooks, Stripe) bind to
      a Claude account, not to this machine, so no flake can hand them over.
    remaining: >-
      Invite each client-work friend into HubSpot, Cloudflare, Stripe and AdministratieX; the
      flake only records which connectors that tier is expected to have. The bookkeeping slot
      changed from Moneybird on 2026-11-17 and its connector situation is unchecked.
    waiting_on: Léon — these are GUI invites in four separate billing accounts
  - id: laya-clm-userscope
    name: Laya available in every project; CLM parked
    status: planned
    note: >-
      Both decision-model servers are project-scope in Laya_And_CLM-MCPs, so they vanish in every
      other folder. The repo already ships register-decision-mcps.sh to fix exactly this. Laya no
      longer waits on anything — it is small, calibrated and CPU-fine, so it goes to user scope
      regardless. CLM is parked: on 2026-11-16 Léon decided to skip it until a machine with a
      24 GB NVIDIA card or a suitable spare box exists (his and Almar's spare machines are weeks
      away). The crew-memory dedup pipeline uses bge-small plus Laya instead
      (research/dedup-without-clm.md); the CLM hosting write-up stays ready for when a box appears.
    remaining: >-
      The mechanism landed 2026-11-20: claude-env.mcp.layaPath registers the Laya server at user
      scope with absolute paths, and CLM is deliberately not registrable, because a server whose
      backend is parked is a tool that always fails. What is left is one line in /etc/nixos
      setting layaPath to the checkout — Léon's, since the path is his.
    paths:
      - /home/leon-new/Projects/Laya_And_CLM-MCPs/register-decision-mcps.sh
      - /home/leon-new/Projects/Laya_And_CLM-MCPs/.mcp.json
  - id: coverage-audit
    name: Domain coverage audit
    status: done
    note: >-
      Ten domains checked on 2026-11-13. Design is over-covered, Roblox is the strongest and
      least shareable, booking does not exist at all, and the security guard turns out to live
      outside the module being extracted.
    paths:
      - /home/leon-new/Projects/claude-env/docs/coverage.md
  - id: guard-portability
    name: The flake must carry the security guard
    status: planned
    note: >-
      Found by the coverage audit. claude-code-policy.nix is a NixOS system module, separate from
      modules/home/claude/, so extracting only the home module would hand friends every skill,
      agent and MCP server with none of the deny rules on .env, /run/agenix and SSH keys.
    remaining: >-
      Expose a nixosModules.default alongside homeManagerModules.default, carrying the policy and
      guard.sh, and state plainly in the guide that the home module alone gives tools without
      brakes.
    paths:
      - /etc/nixos/modules/system/claude-code-policy.nix
      - /etc/nixos/modules/system/claude-code/guard.sh
  - id: friend-guide
    name: The guide for friends
    status: planned
    note: >-
      A friend needs to know what exists, when to reach for which skill or agent, and what the
      guardrails will stop him doing — none of that is discoverable from the flake.
    remaining: >-
      Written after the coverage audit, so it documents the toolkit that actually ships rather
      than the one that exists today.
    absent_paths:
      - /home/leon-new/Projects/claude-env/docs/guide.md
  - id: jira-calendar
    name: Jira on the shared board, wired to Google Calendar
    status: planned
    note: >-
      The crew shares one Jira board for the websites, but there is no Jira MCP server installed
      at any scope, and Jira is not yet feeding Léon's calendar.
    remaining: >-
      Add the Atlassian remote MCP at base tier, and connect Jira to Google Calendar.
  - id: nixos-version-matrix
    name: One module, two NixOS releases
    status: planned
    note: >-
      Found by the hardware inventory. Léon is on 25.05 with home-manager release-25.05; Ryan and
      Kish are on 26.05. A module that evaluates on one and not the other fails the first friend
      who installs it.
    remaining: >-
      Flake exposes modules only and lets each consumer's inputs supply nixpkgs and home-manager;
      a check that evaluates the module against both releases before anything is tagged.
    waiting_on: q-nixos-version and research item nixos-version-matrix
  - id: desktop-neutral
    name: The module must not assume Hyprland
    status: planned
    note: >-
      Found by the hardware inventory. Two of four run KDE Plasma 6 on Wayland. Léon's config was
      built on Hyprland and Kitty. Checked 2026-11-16 against research/desktop-neutral-module.md:
      no portal, compositor, clipboard or notification-channel assumptions, and the notify-send
      call passes. The one gap is claude-mode: modes.nix, claude-mode.sh and cmode.py are built on
      kitten @ remote control (35 references) and cannot work under Konsole, so the modes become
      an opt-in module gated on Kitty.
    remaining: >-
      Run the checklist from research item desktop-neutral-module against the module; guard or
      strip anything compositor-specific; test on a KDE machine before the onboarding test.
    paths:
      - /etc/nixos/modules/home/claude/hooks.nix
  - id: research-track
    name: Research track — free-tool verification
    status: done
    note: >-
      Sixteen items that need looking up rather than deciding, each written as a paste-ready
      prompt so any of the four people's Claudes can take one on any model. Suggested owners per
      person. The binding constraint on all of them is that the setup stays free apart from Claude
      subscriptions and things bought deliberately for production, like a domain or a VPS.
    remaining: >-
      All sixteen answered and filed under research/ on 2026-11-16. Three by Claude at Léon's
      (tested on the machine), nine by Kish in Claude web and reviewed here with the checks that
      needed Léon's machine (module checklist, git merge simulation, embedding timing, official
      pricing pages), four by Claude here (context-budget measured, memory schema proposed, SRS
      and trading data). Nothing reopened a settled decision; two things moved: CLM is parked,
      and the claude-mode layout engine is Kitty-only and must be opt-in.
    paths:
      - /home/leon-new/Projects/claude-env/research/PROGRESS.md
  - id: onboarding-test
    name: Prove it on a friend's laptop
    status: planned
    note: >-
      The only real test of a shareable environment is a second machine going from zero to working
      without Léon typing on it.
    remaining: >-
      One friend adds the flake input, rebuilds, and works through the guide unaided while we
      record every place he gets stuck.
    waiting_on: onboarding-test needs extract-flake, tiers and friend-guide done first
