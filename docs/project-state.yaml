      .
      It also states the absences as deliberate — no GitHub, filesystem or memory server, and no
      hook on SessionStart or UserPromptSubmit — because an absence nobody explains reads as an
      oversight and gets "fixed".
      .
      One rough edge was fixed while writing it: claude-vet's exemption path defaults to the
      relative docs/vet-exemptions.md, which means nothing when the shipped command is run from
      somewhere else, and its block message named that path anyway. It now resolves the path when
      the file exists and otherwise says where one would have to go.
    paths:
      - /home/leon-new/Projects/claude-env/docs/guide.md
