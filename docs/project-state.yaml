      svelte (no LICENSE in the cached subdirectory of a monorepo), and passes superpowers via a
      written exemption, brag, frontend-design and all three candidate packs. It does not shell out
      to `claude plugin details`, which only works after install — the point is to look first — but
      it borrows that command's idea of reporting a projected always-on cost, at the 64 tokens per
      skill measured in research/context-budget.md. Projected is not measured: finding 11 is the
      counter-example, and the output says "projected" for that reason.
    paths:
      - /home/leon-new/Projects/claude-env/justfile
  - id: ct-plugin-channel
    text: >-
      Give plugins and third-party skills a declarative channel, so what is installed is visible in
      the repo and reaches all four laptops
    status: in_progress
    done_when: >-
      Every skill and plugin a crew laptop loads is either declared in this repo or deliberately
      listed as personal, and a fresh laptop that builds the flake gets the same set as Léon's
    note: >-
      The same drift as ct-mcp-declarative, one layer up. Reuse both patterns already in
      skills.nix: a pinned `flake = false` input for a pack taken whole (as claude-web-stack does),
      and a vendored directory carrying its own LICENSE and NOTICE.md for a pack taken in part (as
      the three thermo-nuclear skills do). First adoptions landed 2026-11-19, all by vendoring
      rather than pinning, because reading the packs changed the plan: mattpocock/skills is 39
      skills and addyosmani/agent-skills 26, and most of both duplicate superpowers, the one
      plugin the transcripts show being used. Taken: writing-for-agents, domain-modeling and
      grilling (MIT, Matt Pocock) and performance-optimization (MIT, Addy Osmani), four skills
      and ~256 tokens against ~4,200 for both packs whole. Also repomix from nixpkgs as a CLI
      only. Left: accessibility-engineering, because web-design-guidelines already carries 25
      concrete WCAG rules written against this crew's own stack.
      .
      The plugin half closed on 2026-11-20. All four plugins are now declared in settings.nix
      (svelte and frontend-design were only ever on Léon's machine), and the three
      non-built-in marketplaces carry the commit `just vet` cleared. settings.nix no longer
      merges those two keys: ./scripts/claude-settings.sh deletes `enabledPlugins` and
      `extraKnownMarketplaces` from the file before merging, so an undeclared plugin is removed
      at the next switch and named while it goes. claude-env.plugins.personal and
      .personalMarketplaces are the escape hatch for a plugin that is genuinely one person's.
      .
      Pinning has a version floor: `ref` accepts a commit SHA only from Claude Code 2.1.324, and
      an older version refuses to load a marketplace pinned that way, taking its plugins with
      it. This machine is on 2.1.278 (nixpkgs master is at 2.1.328, so a nixpkgs update crosses
      it). So the module writes both forms and the script picks by the version it finds, warning
      while it is the floating one. The pins start applying with no edit here.
      .
      One plugin cannot be pinned and one must not be. superpowers-marketplace lists superpowers
      as a `url` source on obra/superpowers.git with no ref, so pinning the catalog does not pin
      the plugin — it still tracks main, and the machine is on 7.0.0 against 7.0.2 upstream.
      Closing that means replacing the catalog with an inline `settings` source carrying the
      plugin's own `sha`, which changes how superpowers resolves and wants one supervised
      reinstall: a question for Léon, not a thing to do while he is away.
      frontend-design@claude-plugins-official is on Anthropic's built-in marketplace, whose
      reserved name refuses a commit pin by design.
      .
      The skills half is still open but is far smaller than it looked, because the report that
      sized it was wrong. Corrected 2026-11-21: `just plugins-check` only recognised a declared
      skill when the directory itself was a store symlink, missing the eleven that are a real
      directory holding a store-symlinked SKILL.md — the shape every skill written inline in
      skills.nix and modes.nix takes. The true counts are 16 declared, 9 machine-only real
      directories (all HyperFrames video skills, personal by their nature), 7 symlinks into
      ~/Projects/Claude_testing/skills/ that break on any other laptop, and 3 directories
      (anthropic-skills, obsidian-skills and a second whole copy of superpowers) with no
      SKILL.md of their own, so they register nothing at all and hold 13.6 MB.
      .
      So the decision is about 7 skills rather than 27, and docs/skills-inventory.md has the
      per-skill verdict, the token cost of each group and the three facts that decide how rather
      than whether: Claude_testing's remote is the *private* claude-lab, the local checkout is 8
      commits ahead of it on a detached HEAD with one of the seven edited since, and claude-env
      is public, so vendoring site-analytics publishes the three Blitsol domains it measures.
  - id: ct-tool-trials
    text: >-
      Run the six time-boxed trials from the 40-repo review and record each verdict here
    status: later
    done_when: >-
      Each of Beads, one of Codegraph/Graphify, Serena, one of RTK/Headroom, Claude HUD and the
      raid on wshobson/agents has a dated verdict in this file, and anything that survived is
      declared through ct-plugin-channel rather than installed by hand
    note: >-
      Two groups, run in sequence, never together: repo-scoped (Beads, the graph tool, Serena on
      the largest repo) and machine-scoped on Léon's laptop only (the output compressor, Claude
      HUD). A compressor that rewrites Bash output and a new MCP tool landing in the same fortnight
      makes any measurement uninterpretable.
      .
      All four reachable candidates were vetted on 2026-11-19 with `just vet`, which is as far as
      this can go without Léon: installing any of them is denied as untrusted code integration,
      correctly. Results, worst first.
      .
      Beads (steveyegge/beads, MIT) FAILS the gate: four hooks, of which SessionStart and
      UserPromptSubmit are blocking. The review's note that `--stealth` keeps it from planting
      git hooks is about git, not about Claude Code's lifecycle — it still wants to run on every
      session and every prompt. It needs a written exemption before anyone installs it, and it is
      the most invasive thing on the list.
      .
      wshobson/agents is 185 skills, a projected 11,840 always-on tokens, about 44 per cent of
      session start. It passes the gate (MIT, PreToolUse/PostToolUse only) but the number settles
      the question: raid two or three plugins, never install the catalogue.
      .
      Serena (oraios/serena) declares no hooks and is the quiet one, but its root LICENSE is an
      overview rather than a licence: SolidLSP is MIT and the Serena application is
      GPL-3.0-or-later, in a REUSE-style LICENSES/ directory. Nothing from the GPL half can be
      vendored into this public repo. It also has four `os.system` calls in repo_dir_sync.py.
      .
      Claude HUD (jarrodwatts/claude-hud, MIT, named author) is the cleanest: no hooks declared,
      one skill, and its child_process uses are in maintainer tooling rather than the runtime.
      .
      The compressor half of this trial is in trouble. RTK and Headroom are NOT in nixpkgs under
      any name — the review claimed both were, and `haskellPackages.headroom` is an unrelated
      licence-header manager. So the only two entries of the forty with a real token-saving
      mechanism would both have to be installed imperatively, which is the thing this repo exists
      to stop. Decide whether that is worth an exception before spending a fortnight on it;
      research/context-budget.md finding 9 is the argument that it is not.
  - id: ct-measure-command-output
    text: >-
      Measure how many tokens command output actually costs across recent sessions, so
      q-compressors is decided on a figure instead of an instinct
    status: next
