features:
  - id: mcp-consolidate
    name: Consolidate the 36 scattered MCP servers
    status: done
    note: >-
      Servers were split across three local scopes plus user and project scope; 24 of them were
      reachable only by cd-ing into ~/projects/fastsdcpu or ~, which is why the web-design
      toolkit was invisible everywhere else.
    remaining: >-
      Done 2026-11-20, as part of mcp-declarative rather than as a separate one-off: the prune
      is a clause in the same activation script, so it cannot be half-run or forgotten. Any
      local-scope copy of a declared or dropped server is removed from every projects[<dir>]
      entry on every switch; a local server nobody listed is kept and reported, because it may
      be deliberate. The drop list is 23 names with the audit's reason beside each, now
      including overheid-apis, which turned out not to exist on npm at all.
    paths:
      - /home/leon-new/Projects/claude-env/modules/home/mcp.nix
      - /home/leon-new/Projects/claude-env/modules/home/scripts/claude-mcp.sh
    refs:
      - "mcp.nix lines 11-15 — the CLI-first policy comment, now confirmed as the truth"
  - id: mcp-declarative
    name: Make mcp.nix the single source of truth
    status: done
    note: >-
      mcp.nix used to ship a setup-claude-mcp.sh that had to be run by hand, so user-scope
      servers drifted the moment anyone typed `claude mcp add`. That drift is what produced the
      39 registrations the audit found.
    remaining: >-
      Done 2026-11-20. The script is gone; scripts/claude-mcp.sh writes the declared block on
      activation and prunes the local scopes, and ct-mcp-declarative has the detail. The
      settings half landed the same day (ct-plugin-channel): settings.nix now owns
      enabledPlugins and extraKnownMarketplaces outright for the same reason.
    paths:
      - /home/leon-new/Projects/claude-env/modules/home/mcp.nix
      - /home/leon-new/Projects/claude-env/modules/home/scripts/claude-mcp.sh
      - /home/leon-new/Projects/claude-env/modules/home/settings.nix
  - id: extract-flake
    name: Extract modules/home/claude into its own flake
    status: done
    note: >-
      Done 2026-11-16. ~/Projects/claude-env exports homeManagerModules.default and
      nixosModules.default (the guard); nix-config consumes it as the claude-env input (a path:
      URL until the repo is pushed) and the mr-blue system builds from it, with the managed
      settings byte-identical and CLAUDE.md differing only by the personal lines moving under
      "This machine". Portability fixes on the way: no `inputs` argument (the playbook comes
      through claude-env.webDesignPlaybook), prettier and nixfmt resolved per release, claude-mode
      behind claude-env.modes.enable, the dropped user-scope servers added to mcp.nix's prune list.
    remaining: >-
      The switch itself (`nh os switch /etc/nixos`) and making claude-env its own repo — both
      Léon's (mt-switch-to-flake, mt-repo-init). The old modules/home/claude and
      claude-code-policy.nix in nix-config are now unused and can be deleted after the switch.
