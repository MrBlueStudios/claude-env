      revoking means re-keying secrets and removing four account invites.
    blocks: []
    blocks_note: >-
      Settled in principle; naming the actual people is now part of mt-collect-keys.
    answer: >-
      Only those already working on Blitsol client work, which is all four of the current crew —
      Almar, Ryan, Kish and Léon. Named 2026-11-13. Friends added later get the base tier only,
      with no Blitsol access, so the tier split earns its keep from the first new person.
  - id: q-beads-exemption
    question: >-
      Beads is the only candidate that would give the four of you a git-mergeable shared work
      graph, and it fails the vetting gate. Write it an exemption, or drop it?
    options:
      - Drop it and keep Jira
      - Write an exemption in docs/vet-exemptions.md with an honest reason, then trial it
      - Trial it on one repo only, with the hooks removed by hand
    recommendation: >-
      The first, unless the Jira board turns out not to work for the crew. Beads declares four
      hooks, two of them SessionStart and UserPromptSubmit, so it wants to run code at the start
      of every session and on every prompt — the most invasive thing on the 40-repo list. The
      review's note that `--stealth` stops it planting hooks is about *git* hooks, not Claude
      Code's lifecycle, so it does not help. The third option is worse than it sounds: a plugin
      with its hooks cut by hand is a fork nobody maintains.
    blocks: []
    blocks_note: >-
      ct-tool-trials cannot finish while one of its six candidates has no verdict. Nothing in the
      flake references Beads, so neither answer breaks anything.
    answer: >-
      Dropped on 2026-11-24. Léon took the recommendation — "yeah drop it" — now that the shared
      Jira board is real and pushing its due dates into a calendar, which is the one thing Beads
      was wanted for. No exemption is written, so the vetting gate stands unbroken: the four hooks,
      two of them SessionStart and UserPromptSubmit, were the objection and nothing about them
      changed.
  - id: q-compressors
    question: >-
      RTK and Headroom are the only two entries of the forty with a real token-saving mechanism,
      and neither is packaged. Install one imperatively anyway?
    options:
      - Skip both until one is in nixpkgs
      - Allow one imperative install on Léon's laptop only, as a measured two-week trial
      - Package one in the flake ourselves
    recommendation: >-
      The first. The plan claimed both were in nixpkgs and that is false — the only `headroom`
      is haskellPackages.headroom, an unrelated licence-header manager, and there is no `rtk`.
      So adopting one means a piped installer, pip or npm, which is the drift this repo exists
      to stop. The number decides it: session start re-measured at 27,344 tokens on 2026-11-20,
      of which all MCP servers together are 5,081, so a compressor of *command output* is
      fighting for a slice of the small half. Revisit if a measurement ever shows command output
      is where the tokens actually go.
    blocks:
      - ct-measure-command-output
    blocks_note: >-
      No longer gates ct-tool-trials, which can close with the compressor pair recorded as
      "deferred pending measurement" rather than unjudged. It now gates only
      ct-measure-command-output, which is the thing that answers it.
    answer: >-
      Measure first, 2026-11-24. Léon's instinct was option three, package both ourselves,
      on the grounds that they cut tokens; that premise is the part we cannot confirm, so it was
      put back to him and he chose the measurement. The correction matters and is worth keeping:
      neither RTK nor Headroom touches session start, so the 27,344 / 5,081 figures in the
      recommendation above argue against *server* pruning, not against a compressor — they are
      the wrong number for this question. What a compressor would shrink is command output
      mid-session, and nobody has ever measured how many tokens that is on this machine. So
      ct-measure-command-output runs first and this question is re-answered against a real
      figure: a big slice makes packaging both an easy yes, a small one saves two Nix
      derivations with no nixpkgs presence from being ours to maintain forever on four laptops.
  - id: q-personal-skills
    question: >-
      7 skills load from ~/.claude/skills on Léon's laptop by symlink into a private repo, and 9
      more are local to it. Which of them are crew skills that belong in the flake?
    options:
      - Migrate the ones the crew would use, leave the rest personal and declared as personal
      - Migrate all 27, on the grounds that a shared environment should be the same everywhere
