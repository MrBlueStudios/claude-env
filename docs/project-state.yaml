      in his favour, one against.
      .
      CONFIRMED, from administratiex.nl/prijzen and /gratis-boekhouden: the free plan allows
      "Tot 2 gebruikers", with no invoice limit, no customer limit and no revenue limit. So the
      two-user allowance is real and free. Also free: unlimited sales invoices and quotes, bank
      import (MT940/CAMT.053) with matching, quarterly VAT prepared AND filed digitally 4x a
