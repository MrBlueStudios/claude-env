questions:
  - id: q-mcp-philosophy
    question: >-
      mcp.nix says CLI-first and lists github, filesystem, memory and playwright as legacy to be
      pruned, but all four are live at user scope. Which one is the truth?
    options:
      - Enforce CLI-first — prune github, filesystem and memory, keep playwright for the design skill
      - Keep what is installed and rewrite mcp.nix to match reality
      - Tier it — a lean base set, with the rest opt-in per friend
    recommendation: >-
      The first. gh --json --jq beats the GitHub MCP on token cost and the built-in file tools beat
      the filesystem MCP, which cannot even see ~/Projects. Keep playwright, because the design and
      web-design-playbook skills drive a browser. The memory MCP is the one real loss and it
      overlaps your file-based memory anyway, so drop it and keep one memory system.
    blocks: []
    blocks_note: >-
      Settled before any server list was written into Nix, which was the point of asking first.
    answer: >-
      Enforce CLI-first. Prune github, filesystem and memory; keep playwright. Léon accepted the
      recommendation on 2026-11-13.
  - id: q-repo-name
    question: What is the repo called, and is it public?
    options:
      - Public github.com/MrBlueStudios/claude-env, zero secrets in it
      - Private repo, friends added as collaborators
      - Public flake plus a private sibling repo for Blitsol bits
    recommendation: >-
      The third. The flake itself holds no secrets, so public costs nothing and lets friends pin it
      with a plain URL; anything Blitsol-shaped lives in a private sibling that only the Blitsol
      tier needs access to.
    blocks: []
    blocks_note: >-
      Settled before the URL could be baked into anyone's config, which is what made it urgent.
    answer: >-
      Public flake plus a private sibling. Léon accepted the recommendation on 2026-11-13; the two
      names are Claude's call — github.com/MrBlueStudios/claude-env (public) and
      github.com/MrBlueStudios/blitsol-secrets (private) — and he can override either.
  - id: q-secrets-repo
    question: Where do the shared Blitsol secrets live, and who can decrypt them?
    options:
      - A private blitsol-secrets repo with agenix, each friend's SSH key as a recipient
      - Each friend keeps his own copy in his own nix-config
      - A shared Bitwarden collection, pasted in by hand when needed
    recommendation: >-
      The first. It is the only one where revoking a person is a single re-key and a push, and you
      already run agenix so there is nothing new to learn.
    blocks: []
    blocks_note: >-
      Settled; the enrolment runbook can now be written against a known mechanism.
    answer: >-
      A private blitsol-secrets repo with agenix, each client-work friend's SSH key as a recipient.
      Léon accepted the recommendation on 2026-11-13.
  - id: q-jira-mcp
    question: >-
      There is no Jira MCP at any scope. Does the crew get one, or stay on the browser?
    options:
      - Atlassian's official remote MCP at base tier
      - A CLI wrapper, consistent with the CLI-first rule
      - Nothing — Jira stays a browser tab
    recommendation: >-
      The Atlassian remote MCP at base tier. You share one board across the website work, so
      reading and filing issues from inside Claude Code is the difference between the board being
      current and being fiction. It is also the one tool every friend touches on day one.
    blocks: []
    blocks_note: >-
      Settled; the base tier's server list can now be finalised before extraction.
    answer: >-
      Atlassian's official remote MCP at base tier. Léon accepted the recommendation on 2026-11-13.
      This is the one deliberate exception to the CLI-first rule, because every friend uses the
      shared board daily.
  - id: q-nixos-version
    question: >-
      Léon runs NixOS 25.05, Ryan and Kish run 26.05. Does the flake support both, does Léon
      upgrade, or does everyone pin one release?
    options:
      - The flake supports both releases and Léon also upgrades to 26.05
      - The flake supports both releases, Léon stays on 25.05
      - Everyone pins 25.05 to match the maintainer
    recommendation: >-
      The first, now with evidence. Research item nixos-version-matrix evaluated the actual Claude
      modules on both releases: the NixOS guard module passes unchanged, the home-manager module
      needs one release-guarded attribute (prettier), so both-release support is cheap. The
      upgrade cost is three branch bumps (nixpkgs, home-manager, stylix) plus a dry run; and the
      nixos-25.05 branch has been end-of-life since 2025-12-31, so Léon's laptop has had no
      security updates for ten months. Upgrade this week; the only step before touching
      /etc/nixos is the dry-run command in research/nixos-version-matrix.md.
    blocks: []
    blocks_note: >-
      Answered 2026-11-16; extract-flake is no longer gated on it.
    answer: >-
      The flake supports both releases and Léon upgrades to 26.05. Léon confirmed on 2026-11-16,
      after research/nixos-version-matrix.md showed the modules evaluate on both releases with one
      guarded fix and that the 25.05 branch is end-of-life. Re-confirmed 2026-11-24 — "support
