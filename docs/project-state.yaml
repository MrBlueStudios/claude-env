      LAYA_MCP_MODEL=auto and LAYA_MCP_PRELOAD=english). CLM is absent by construction rather
      than conditional on a tailnet lookup — a Nix build cannot resolve a host, and a
      registration that depended on one would mean a server appearing or vanishing depending on
      whether the laptop was on the tailnet at build time, which is worse than parked. What is
      left is one line in /etc/nixos setting layaPath, which is Léon's because the path is his.
