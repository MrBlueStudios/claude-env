    status: done
    note: >-
      Done 2026-11-19. ponytail and pstack removed, their marketplaces with them; ponytail's
      ruleset vendored as modules/home/rules/lazy-senior/ (MIT, author named) because the rules
      were the whole value and the plugin's UserPromptSubmit hook plus a webhookUrl option with
