      .
      Two sections exist because of what this phase found rather than because the done_when asked
      for them. "Your own machine, your own additions" is there because the repo now removes
      undeclared plugins and servers at the next switch, and a friend who loses something without
      being told why will not trust the next switch either — so the guide explains the rule
