  - id: ct-enrolment
    text: Write the agenix enrolment runbook for adding and removing a Blitsol friend
    status: done
    done_when: >-
      The runbook takes one SSH public key to a re-keyed secret the friend can decrypt, and names
      the exact steps to revoke it again
    note: >-
      docs/enrolment.md, 2026-11-20. Every command says which directory it runs in and on whose
      machine, because half of them are run by the friend and half by Léon.
      .
      Three things in it were checked against the real setup rather than written from memory. The
      recipient you need is the friend's *host* key, not their personal one, because agenix
      decrypts during their activation as root — their personal key only matters if they will
      edit secrets. The key must be the raw ssh-ed25519 line and not the ssh-to-age form, which
      /etc/nixos/secrets/secrets.nix already warns about at length because it has cost someone an
      evening. And the verification step is a recipient count from the age header
      (`grep -ac '^-> '`, where -a is not optional because the file is binary and plain grep -c
      prints nothing at all); every file in /etc/nixos/secrets currently reads 3, so after one
      person is added every file must read 4 and a file left at 3 is the one they cannot open.
      .
      The revoke half has four steps and the fourth is the only one that is security rather than
      bookkeeping: re-keying does not un-leak. They had the plaintext and may still hold an old
      clone whose ciphertext their key opens, so each value has to be rotated at its source,
      worst first.
      .
      The runbook cannot be executed yet: blitsol-secrets does not exist (mt-collect-keys), so it
      opens with how to create it. Worth knowing before trusting that repo as an inventory:
      secrets.nix declares sixteen secrets and four .age files exist, firecrawl-api-key.age among
      the missing twelve — which is why the firecrawl wrapper warns at startup.
