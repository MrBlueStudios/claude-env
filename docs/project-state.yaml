    paths:
      - /etc/nixos/modules/system/claude-code-policy.nix
  - id: ct-audit-table
    text: >-
      Produce the keep/drop/tier table for all 36 MCP servers, applying the settled CLI-first rule
    status: done
    done_when: >-
      docs/mcp-audit.md lists every server with a verdict and a one-line reason, and every
      placeholder-token server is marked dead-or-fix
    paths:
      - /home/leon-new/Projects/claude-env/docs/mcp-audit.md
  - id: ct-extract
    text: >-
      Extract modules/home/claude into github.com/MrBlueStudios/claude-env and make nix-config
      consume it as an input
