  - id: ct-guard-module
    text: >-
      Expose nixosModules.default carrying claude-code-policy.nix and guard.sh, so the flake
      ships the guardrails and not just the tools
    status: done
    note: >-
      Done with the extraction (2026-11-16): nixosModules.default is modules/system/guard.nix,
      tests/eval-*/flake.nix evaluates it, and the README says the home module alone gives the
      tools without the brakes.
