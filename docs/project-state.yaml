      and the first-hour walkthrough — and a friend can follow it without asking Léon a question
    note: >-
      docs/guide.md, 2026-11-20, nine sections: install and how to check it took, the two tiers
      and the six opt-in modules, the inventory (servers, CLIs, skills, agents, plugins, hooks),
