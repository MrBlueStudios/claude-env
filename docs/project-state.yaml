      measure *session start*, which is the wrong half for this question: a compressor shrinks
      tool results mid-session and never touches the system prompt. The transcripts are already
      on disk — 580 of them as of finding 11 — so this is counting, not instrumenting: sum the
      tool_result content per session and compare it with the session's total. Bash, Read and
      Grep results are the three worth breaking out, since those are what a compressor targets.
