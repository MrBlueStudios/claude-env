  - id: ct-guard-refspec
    text: >-
      Fix the force-push rule's false positives: it read the whole command string, so an ordinary
      push was blocked by a + or a -f belonging to something else in the same line
    status: done
    done_when: >-
      A commit message containing "+0" and an `rm -f` before a push both stop being read as
      force-pushes, while every real force-push to main is still denied
    note: >-
      Found 2026-11-20 by hitting it twice in one session: `jj describe -m '... +0' && jj git push
      --bookmark main` was denied as a force-push to main, because `\s\+\S` matched the message
      rather than a refspec, and a heredoc containing both example commands as documentation text
      was denied for the same reason. `rm -f old.log && git push origin main` had the same defect.
      .
      Fixed by scoping the flag search to the push command itself — `grep -oP '\bgit\s+push\b[^;&|]*'`
      — and tightening the refspec pattern to `\s\+[\w./*-]+(:|\s|$)`. The branch-name check still
      reads the whole string on purpose, because `git switch main && git push -f` is genuinely a
      force-push to main. Seven cases added, 58 -> 65, and the old pattern was replayed against the
      new cases to confirm they bite.
      .
      Worth knowing: the fix only reaches the machine at the next switch, because the running
      guard comes from /etc/claude-code/managed-settings.json. Until then the false positive is
      still live, and the honest workaround is to use the file-editing tools rather than a bash
      heredoc containing the example text.
